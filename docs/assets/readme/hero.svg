<svg xmlns="http://www.w3.org/2000/svg" width="956" height="656" aria-labelledby="hero-title hero-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" viewBox="0 0 956 656"><title id="hero-title">同一个应用：人在页面里读，AI 在右侧应用区会话里调用它</title><desc id="hero-desc">左边是信息收件箱的阅读页，右边是同属这个应用的应用区会话；AI 读完正文整理出三条待办，写入前在同一入口弹出确认。</desc><defs><clipPath id="frame"><rect width="900" height="600" x="28" y="28" rx="18"/></clipPath><filter id="frame-shadow" width="116%" height="128%" x="-8%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#0f1115" flood-opacity=".13" stdDeviation="16"/></filter><linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f8"/></linearGradient></defs><rect width="956" height="656" x="0" y="0" fill="url(#page)" rx="0"/><g clip-path="url(#frame)"><rect width="900" height="48" x="28" y="28" fill="#fff" rx="0"/><path stroke="#ebeef2" stroke-width="1" d="M28 76H928"/><path fill="none" stroke="#4e5969" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M49 46L43 52L49 58"/><g transform="translate(79 46)"><circle cx="3.4" cy="2.8" r="1.6" fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"/><circle cx="3.4" cy="9.2" r="1.6" fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"/><circle cx="8.8" cy="5.4" r="1.6" fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"/><path fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="M3.4 4.4V7.6"/><path fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="M4.9 5.4h2.3"/></g><text x="98" y="56" fill="#4e5969" font-size="13" font-weight="400">Git 浏览</text><g><path fill="none" stroke="#adb2b8" stroke-linecap="round" stroke-linejoin="round" stroke-wi
<text x="64" y="322" font-size="13" font-weight="400" fill="#4e5969">五个内置应用：主页、笔记、待办、信息收件箱、Git 浏览。</text>
<circle cx="51" cy="344" r="2.2" fill="#4e5969"/>
<text x="64" y="348" font-size="13" font-weight="400" fill="#4e5969">运行时、存储、页面外壳、权限和 AI 接入由框架提供，应用只写自己的领域</text>
<text x="64" y="369" font-size="13" font-weight="400" fill="#4e5969">操作。</text>
<circle cx="51" cy="391" r="2.2" fill="#4e5969"/>
<text x="64" y="395" font-size="13" font-weight="400" fill="#4e5969">应用通过公开操作互相协作，目标应用仍按自己的业务校验处理请求。</text>
<text x="48" y="431" font-size="15" font-weight="600" fill="#1d2129">一次调用经过什么</text>
<text x="48" y="457" font-size="13" font-weight="400" fill="#4e5969">页面、会话和应用接口走同一条路径：应用声明、参数校验、授权或确认、调用</text>
<text x="48" y="478" font-size="13" font-weight="400" fill="#4e5969">历史。</text>
<text x="48" y="521" font-size="15" font-weight="600" fill="#1d2129">已知边界</text>
<circle cx="51" cy="543" r="2.2" fill="#4e5969"/>
<text x="64" y="547" font-size="13" font-weight="400" fill="#4e5969">当前只在 Linux 上验证过，macOS 和 Windows 尚未验证。</text>
<circle cx="51" cy="569" r="2.2" fill="#4e5969"/>
<text x="64" y="573" font-size="13" font-weight="400" fill="#4e5969">试验阶段，接口和应用集合仍可能变化。</text>
<rect x="649.8" y="92" width="258.2" height="60" rx="12" fill="#edf3fe"/>
<text x="665.8" y="112" font-size="13" font-weight="400" fill="#1d2129">@信息收件箱 @待办 把这篇内容的决定</text>
<text x="665.8" y="132" font-size="13" font-weight="400" fill="#1d2129">整理成 3 条待办。</text>

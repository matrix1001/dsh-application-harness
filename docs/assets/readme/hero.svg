1" rx="6"/><text x="442" y="147" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">添加链接</text><rect width="352" height="28" x="48" y="129" fill="#f7f8fa" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="60" y="147" fill="#86909c" font-size="12" font-weight="400">搜索标题、摘要、正文</text><path stroke="#eef0f2" stroke-width="1" d="M28 169H548"/><path fill="none" stroke="#4e5969" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="M54 186l-5 5 5 5"/><text x="68" y="196" fill="#86909c" font-size="12" font-weight="400">matrix1001/dsh-application-harness</text><text x="528" y="196" fill="#86909c" font-size="12" font-weight="400" text-anchor="end">11月26日 13:54</text><text x="48" y="228" fill="#1d2129" font-size="19" font-weight="600">v0.1.0：内置应用、公开操作与统一入口</text><rect width="82" height="26" x="48" y="242" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="89" y="259" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">打开原文 ↗</text><rect width="68" height="26" x="138" y="242" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="172" y="259" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">标为未读</text><rect width="44" height="26" x="214" y="242" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="236" y="259" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">收藏</text><rect width="56" height="26" x="472" y="242" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="500" y="259" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">存笔记</text><rect width="56" height="26" x="408" y="242" fill="#fff" stroke="#c9d7ff" stroke-width="1" rx="6"/><text x="436" y="259" fill="#4d6bfe" font-size="12" font-weight="400" text-anchor="middle">转任务</text><text x="48" y="296" fill="#1d2129" font-size="15" font-weight="600">这个版本包含</text><circle cx="51" cy="318" r="2.2" fill="#4e5969"/><text x="64" y="322" fill="#4e5969" font-size="13" font-weight="400">五个内置应用：主页、笔记、待办、信息收件箱、Git 浏览。</text><circle cx="51" cy="344" r="2.2" fill="#4e5969"/><text x="64" y="348" fill="#4e5969" font-size="13" font-weight="400">运行时、存储、页面外壳、权限和 AI 接入由框架提供，应用只写自己的领域</text><text x="64" y="369" fill="#4e5969" font-size="13" font-weight="400">操作。</text><circle cx="51" cy="391" r="2.2" fill="#4e5969"/><text x="64" y="395" fill="#4e5969" font-size="13" font-weight="400">应用通过公开操作互相协作，目标应用仍按自己的业务校验处理请求。</text><text x="48" y="431" fill="#1d2129" font-size="15" font-weight="600">一次调用经过什么</text><text x="48" y="457" fill="#4e5969" font-size="13" font-weight="400">页面、会话和应用接口走同一条路径：应用声明、参数校验、授权或确认、调用</text><text x="48" y="478" fill="#4e5969" font-size="13" font-weight="400">历史。</text><text x="48" y="521" fill="#1d2129" font-size="15" font-weight="600">已知边界</text><circle cx="51" cy="543" r="2.2" fill="#4e5969"/><text x="64" y="547" fill="#4e5969" font-size="13" font-weight="400">当前只在 Linux 上验证过，macOS 和 Windows 尚未验证。</text><circle cx="51" cy="569" r="2.2" fill="#4e5969"/><text x="64" y="573" fill="#4e5969" font-size="13" font-weight="400">试验阶段，接口和应用集合仍可能变化。</text><rect width="258.2" height="60" x="649.8" y="92" fill="#edf3fe" rx="12"/><text x="665.8" y="112" fill="#1d2129" font-size="13" font-weight="400">@信息收件箱 @待办 把这篇内容的决定</text><text x="665.8" y="132" fill="#1d2129" font-size="13" font-weight="400">整理成 3 条待办。</text><g transform="translate(568 171)"><rect width="12" height="12" fill="none" stroke="#b9bfc9" stroke-width="1.1" rx="3.5"/><path fill="none" stroke="#b9bfc9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1" d="M4 6h4M6.6 4.2L8.4 6 6.6 7.8"/></g><text x="588" y="180" fill="#4e5969" font-size="12" font-weight="400">读取</text><text x="620" y="180" fill="#86909c" font-size="12" font-weight="400">信息收件箱 · 正文</text><text x="568" y="206" fill="#4e5969" font-size="13" font-weight="400">这篇讲的是首个 Release 包含什么、一次调用要经过哪</text><text x="568" y="227" fill="#4e5969" font-size="13" font-weight="400">些检查，以及当前的验证边界。</text><text x="568" y="262" fill="#1d2129" font-size="13" font-weight="400">已经按正文整理了 3 条，确认后写入待办：</text><rect width="11" height="11" x="568" y="277" fill="none" stroke="#cfd3d6" stroke-width="1" rx="3"/><text x="587" y="288" fill="#1d2129" font-size="13" font-weight="400">补 macOS 和 Windows 的验证记录</text><text x="908" y="288" fill="#86909c" font-size="11" font-weight="400" text-anchor="end">11月28日</text><rect width="11" height="11" x="568" y="303" fill="none" stroke="#cfd3d6" stroke-width="1" rx="3"/><text x="587" y="314" fill="#1d2129" font-size="13" font-weight="400">整理五个内置应用的公开操作清单</text><text x="908" y="314" fill="#86909c" font-size="11" font-weight="400" text-anchor="end">11月29日</text><rect width="11" height="11" x="568" y="329" fill="none" stroke="#cfd3d6" stroke-width="1" rx="3"/><text x="587" y="340" fill="#1d2129" font-size="13" font-weight="400">把安装步骤补进上手文档</text><text x="908" y="340" fill="#86909c" font-size="11" font-weight="400" text-anchor="end">12月1日</text><rect width="340" height="88" x="568" y="358" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="10"/><text x="582" y="382" fill="#4d6bfe" font-size="13" font-weight="500">转任务</text><text x="629" y="382" fill="#1d2129" font-size="13" font-weight="500">待办 · 创建 3 条</text><text x="582" y="402" fill="#86909c" font-size="12" font-weight="400">确认后写入待办，并带上这篇文章的来源。</text><rect width="52" height="26" x="842" y="412" fill="#4d6bfe" rx="6"/><text x="868" y="429" fill="#fff" font-size="12" font-weight="400" text-anchor="middle">允许</text><rect width="52" height="26" x="782" y="412" fill="#fff" stroke="#e5e6eb" stroke-width="1" rx="6"/><text x="808" y="429" fill="#4e5969" font-size="12" font-weight="400" text-anchor="middle">拒绝</text><text x="570" y="520" fill="#86909c" font-size="12" font-weight="400">标准模式</text><path fill="none" stroke="#86909c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1" d="M624 515l3 3 3-3"/><rect width="340" height="76" x="568" y="532" fill="#fff" stroke="#dbe0e8" stroke-width="1" rx="18"/><text x="584" y="562" fill="#86909c" font-size="13" font-weight="400">继续提问，或选择应用</text><path stroke="#4e5969" stroke-linecap="round" stroke-width="1.4" d="M592 584v10M587 589h10"/><circle cx="882" cy="588" r="13" fill="#4d6bfe"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M882 594v-11M877 588l5-5 5 5"/></g><rect width="899" height="599" x="28.5" y="28.5" fill="none" stroke="#dfe5ee" filter="url(#frame-shadow)" rx="18"/></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="gate-title gate-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="gate-title">三种使用者，同一条调用路径</title>
  <desc id="gate-desc">人通过页面、AI 通过在会话里选择应用、其他应用通过公开接口使用同一个应用；三种使用者进入同一条调用路径，依次经过应用声明、参数校验、授权或确认、调用历史，然后才到达应用及其自己的数据。</desc>

  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4d6bfe"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- three callers -->
  <g>
    <rect x="32" y="24" width="352" height="120" rx="16" fill="#ffffff" stroke="#e5e6eb"/>
    <g transform="translate(80,84)" fill="none" stroke="#1f2329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-9" r="6.5"/>
      <path d="M-12 17C-10 8-5 5 0 5C5 5 10 8 12 17"/>
    </g>
    <text x="124" y="74" font-size="26" font-weight="600" fill="#1f2329">人</text>
    <text x="124" y="106" font-size="18" fill="#4e5969">在页面里读、整理、发起</text>
  </g>

  <g>
    <rect x="424" y="24" width="352" height="120" rx="16" fill="#ffffff" stroke="#e5e6eb"/>
    <circle cx="472" cy="84" r="17" fill="#eef2ff"/>
    <text x="472" y="92" text-anchor="middle" font-size="22" font-weight="600" fill="#4d6bfe">@</text>
    <text x="516" y="74" font-size="26" font-weight="600" fill="#1f2329">AI</text>
    <text x="516" y="106" font-size="18" fill="#4e5969">在会话里选择应用后调用</text>
  </g>

  <g>
    <rect x="816" y="24" width="352" height="120" rx="16" fill="#ffffff" stroke="#e5e6eb"/>
    <g transform="translate(864,84)" fill="none" stroke="#1f2329" stroke-width="2" stroke-linejoin="round">
      <rect x="-14" y="-13" width="12" height="12" rx="3"/>
      <rect x="2" y="-13" width="12" height="12" rx="3"/>
      <rect x="-14" y="1" width="12" height="12" rx="3"/>
      <rect x="2" y="1" width="12" height="12" rx="3"/>
    </g>
    <text x="908" y="74" font-size="26" font-weight="600" fill="#1f2329">其他应用</text>
    <text x="908" y="106" font-size="18" fill="#4e5969">按公开接口调用</text>
  </g>

  <path d="M208 144V196" fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)"/>
  <path d="M600 144V196" fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)"/>
  <path d="M992 144V196" fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)"/>


  <!-- one gate, four checks -->
  <rect x="32" y="204" width="1136" height="112" rx="16" fill="#f7f8fa" stroke="#e5e6eb"/>
  <g stroke="#e5e6eb" stroke-dasharray="2 6" stroke-linecap="round">
    <path d="M259 226V294"/>
    <path d="M486 226V294"/>
    <path d="M714 226V294"/>
    <path d="M941 226V294"/>
  </g>
  <g>
    <circle cx="103" cy="260" r="13" fill="#eef2ff"/>
    <text x="103" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#4d6bfe">1</text>
    <text x="126" y="267" font-size="19" fill="#1f2329">应用声明</text>

    <circle cx="330" cy="260" r="13" fill="#eef2ff"/>
    <text x="330" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#4d6bfe">2</text>
    <text x="353" y="267" font-size="19" fill="#1f2329">参数校验</text>

    <circle cx="557" cy="260" r="13" fill="#eef2ff"/>
    <text x="557" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#4d6bfe">3</text>
    <text x="580" y="267" font-size="19" fill="#1f2329">开放策略</text>

    <circle cx="775" cy="260" r="13" fill="#eef2ff"/>
    <text x="775" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#4d6bfe">4</text>
    <text x="798" y="267" font-size="19" fill="#1f2329">授权或确认</text>

    <circle cx="1011" cy="260" r="13" fill="#eef2ff"/>
    <text x="1011" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#4d6bfe">5</text>
    <text x="1034" y="267" font-size="19" fill="#1f2329">调用历史</text>
  </g>

  <path d="M480 316V352" fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)"/>

  <!-- the application, with its own reader and data -->
  <g>
    <rect x="200" y="352" width="560" height="184" rx="14" fill="#ffffff" stroke="#d0d7de"/>
    <path d="M200 386H760" stroke="#e5e6eb"/>
    <rect x="216" y="364" width="56" height="14" rx="7" fill="#eef2ff"/>
    <rect x="280" y="364" width="44" height="14" rx="7" fill="#f2f3f5"/>
    <rect x="332" y="364" width="44" height="14" rx="7" fill="#f2f3f5"/>
    <rect x="720" y="366" width="22" height="10" rx="5" fill="#e5e6eb"/>

    <rect x="216" y="402" width="152" height="120" rx="10" fill="#fafbfc" stroke="#eef0f2"/>
    <rect x="228" y="416" width="72" height="8" rx="4" fill="#d0d7de"/>
    <rect x="228" y="434" width="112" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="228" y="450" width="96" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="228" y="466" width="120" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="228" y="482" width="88" height="7" rx="3.5" fill="#e5e6eb"/>

    <rect x="384" y="402" width="360" height="120" rx="10" fill="#ffffff" stroke="#eef0f2"/>
    <rect x="400" y="416" width="148" height="10" rx="5" fill="#86909c"/>
    <rect x="400" y="440" width="316" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="400" y="456" width="300" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="400" y="472" width="312" height="7" rx="3.5" fill="#e5e6eb"/>
    <rect x="400" y="488" width="184" height="7" rx="3.5" fill="#e5e6eb"/>
  </g>

  <text x="800" y="408" font-size="26" font-weight="600" fill="#1f2329">应用及其数据</text>
  <text x="800" y="448" font-size="18" fill="#4e5969">数据和权限属于应用，</text>
  <text x="800" y="474" font-size="18" fill="#4e5969">不属于某一次会话。</text>
  <text x="800" y="512" font-size="18" fill="#4e5969">页面关闭后状态仍在。</text>
</svg>

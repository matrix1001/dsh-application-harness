<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" aria-labelledby="gate-title gate-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" viewBox="0 0 1200 560"><title id="gate-title">三种使用者，同一条调用路径</title><desc id="gate-desc">人通过页面、AI 通过在会话里选择应用、其他应用通过公开接口使用同一个应用；三种使用者进入同一条调用路径，依次经过应用声明、参数校验、授权或确认、调用历史，然后才到达应用及其自己的数据。</desc><defs><marker id="gate-arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#4d6bfe" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1200" height="560" fill="#fff"/><g><rect width="352" height="120" x="32" y="24" fill="#fff" stroke="#e5e6eb" rx="16"/><g fill="none" stroke="#1f2329" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(80,84)"><circle cx="0" cy="-9" r="6.5"/><path d="M-12 17C-10 8-5 5 0 5C5 5 10 8 12 17"/></g><text x="124" y="74" fill="#1f2329" font-size="26" font-weight="600">人</text><text x="124" y="106" fill="#4e5969" font-size="18">在页面里读、整理、发起</text></g><g><rect width="352" height="120" x="424" y="24" fill="#fff" stroke="#e5e6eb" rx="16"/><circle cx="472" cy="84" r="17" fill="#eef2ff"/><text x="472" y="92" fill="#4d6bfe" font-size="22" font-weight="600" text-anchor="middle">@</text><text x="516" y="74" fill="#1f2329" font-size="26" font-weight="600">AI</text><text x="516" y="106" fill="#4e5969" font-size="18">在会话里选择应用后调用</text></g><g><rect width="352" height="120" x="816" y="24" fill="#fff" stroke="#e5e6eb" rx="16"/><g fill="none" stroke="#1f2329" stroke-linejoin="round" stroke-width="2" transform="translate(864,84)"><rect width="12" height="12" x="-14" y="-13" rx="3"/><rect width="12" height="12" x="2" y="-13" rx="3"/><rect width="12" height="12" x="-14" y="1" rx="3"/><rect width="12" height="12" x="2" y="1" rx="3"/></g><text x="908" y="74" fill="#1f2329" font-size="26" font-weight="600">其他应用</text><text x="908" y="106" fill="#4e5969" font-size="18">按公开接口调用</text></g><path fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)" d="M208 144V196"/><path fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)" d="M600 144V196"/><path fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)" d="M992 144V196"/><rect width="1136" height="112" x="32" y="204" fill="#f7f8fa" stroke="#e5e6eb" rx="16"/><g stroke="#e5e6eb" stroke-dasharray="2 6" stroke-linecap="round"><path d="M259 226V294"/><path d="M486 226V294"/><path d="M714 226V294"/><path d="M941 226V294"/></g><g><circle cx="103" cy="260" r="13" fill="#eef2ff"/><text x="103" y="266" fill="#4d6bfe" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="126" y="267" fill="#1f2329" font-size="19">应用声明</text><circle cx="330" cy="260" r="13" fill="#eef2ff"/><text x="330" y="266" fill="#4d6bfe" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="353" y="267" fill="#1f2329" font-size="19">参数校验</text><circle cx="557" cy="260" r="13" fill="#eef2ff"/><text x="557" y="266" fill="#4d6bfe" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="580" y="267" fill="#1f2329" font-size="19">开放策略</text><circle cx="775" cy="260" r="13" fill="#eef2ff"/><text x="775" y="266" fill="#4d6bfe" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="798" y="267" fill="#1f2329" font-size="19">授权或确认</text><circle cx="1011" cy="260" r="13" fill="#eef2ff"/><text x="1011" y="266" fill="#4d6bfe" font-size="15" font-weight="600" text-anchor="middle">5</text><text x="1034" y="267" fill="#1f2329" font-size="19">调用历史</text></g><path fill="none" stroke="#4d6bfe" stroke-width="2" marker-end="url(#gate-arrow)" d="M480 316V352"/><g><rect width="560" height="184" x="200" y="352" fill="#fff" stroke="#d0d7de" rx="14"/><path stroke="#e5e6eb" d="M200 386H760"/><rect width="56" height="14" x="216" y="364" fill="#eef2ff" rx="7"/><rect width="44" height="14" x="280" y="364" fill="#f2f3f5" rx="7"/><rect width="44" height="14" x="332" y="364" fill="#f2f3f5" rx="7"/><rect width="22" height="10" x="720" y="366" fill="#e5e6eb" rx="5"/><rect width="152" height="120" x="216" y="402" fill="#fafbfc" stroke="#eef0f2" rx="10"/><rect width="72" height="8" x="228" y="416" fill="#d0d7de" rx="4"/><rect width="112" height="7" x="228" y="434" fill="#e5e6eb" rx="3.5"/><rect width="96" height="7" x="228" y="450" fill="#e5e6eb" rx="3.5"/><rect width="120" height="7" x="228" y="466" fill="#e5e6eb" rx="3.5"/><rect width="88" height="7" x="228" y="482" fill="#e5e6eb" rx="3.5"/><rect width="360" height="120" x="384" y="402" fill="#fff" stroke="#eef0f2" rx="10"/><rect width="148" height="10" x="400" y="416" fill="#86909c" rx="5"/><rect width="316" height="7" x="400" y="440" fill="#e5e6eb" rx="3.5"/><rect width="300" height="7" x="400" y="456" fill="#e5e6eb" rx="3.5"/><rect width="312" height="7" x="400" y="472" fill="#e5e6eb" rx="3.5"/><rect width="184" height="7" x="400" y="488" fill="#e5e6eb" rx="3.5"/></g><text x="800" y="408" fill="#1f2329" font-size="26" font-weight="600">应用及其数据</text><text x="800" y="448" fill="#4e5969" font-size="18">数据和权限属于应用，</text><text x="800" y="474" fill="#4e5969" font-size="18">不属于某一次会话。</text><text x="800" y="512" fill="#4e5969" font-size="18">页面关闭后状态仍在。</text></svg>
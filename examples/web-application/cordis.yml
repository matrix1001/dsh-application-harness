# Opt-in application surface over the web profile: the application runtime, the
# persistence store, the tool bridge, the page-context reader, the host bridge
# (the browser's applications Remote namespace), the network capability, and the
# browser application shell. This file is a PATCH OVERLAY over the web
# profile (dsh-base + dsh-web-app bundle layers), not a tree:
# `dsh web --patch examples/web-application/cordis.yml` applies it as one
# more sibling patch list at the same include level, so these inserts reach
# the composed tree like any bundle row. A patch replaces the targeted row's
# whole `config`.
#
# The application runtime row mounts `ctx.applications` — the registry the
# application rows register their declarations on, and the one call path every
# caller (human, AI, peer) goes through; the runtime owns the lifecycle
# (mounted = started). The bridge serves the `applications` Remote the browser
# shell rides; the overlay supplies the runtime, the store, the tool bridge (the
# web profile already mounts `dsh-tools`), the network seam, the context reader,
# the browser shell, and the git-browser example row. The platform rows (typert
# registry, jobs, settings, credentials, subprocess) are the web profile's own —
# every dsh profile carries them, so the overlay carries application-side rows
# only.
#
# ⚠️ 机械行**不是手抄的**：下面 `--- machinery rows ---` 与 `--- example rows ---`
# 之间的整段由 `node scripts/generate-bundle-patch.mjs` 从 bundle patch
# （`packages/bundle/app-harness/cordis.patch.yml` 即规范来源）生成，手工改动会被
# 该脚本的 `--check` 判红（它在 release:check 里）。这个 overlay 曾把同一批行整段
# 复制一份，于是"第二份拷贝"可以与真源静默分叉——`client-ui-disk-analysis` 就曾在这里
# 挂着却没有宿主应用行，而所有门禁全绿（2026-09-23 收口）。
#
# 手写的只有两处：本文件头（说明与意图），以及 `--- example rows ---` 之下本示例
# 自己的示例行——本 overlay 有意演示「web profile + 完整挽具机械行 + git-browser
# 示例行」的形态，不做精简，所以机械行按 `machinery-rowset: full` 全量生成。
# 行集一致性另由 `scripts/verify-example-compositions.mjs` 门禁守护（按该声明比对
# 组合内机械行的 id/name）；示例行与该包 `dsh.appRow` 声明比对（id+name，配置不比对），
# 且视图行必须有其宿主应用行。
# machinery-rowset: full
- insert:
    # --- machinery rows (generated from packages/bundle/app-harness/cordis.patch.yml; node scripts/generate-bundle-patch.mjs) ---
    # The application runtime: one service (`ctx.applications`) holding the
    # registry, the one call path (identity, availability, declaration,
    # parameters, openness, grant or confirmation) and the lifecycle
    # (mounted = started). The application rows register their own declarations
    # on it; no other row owns application state. Configured with no data path
    # on purpose: history is a bounded in-memory window here (a deployment that
    # wants it durable wires its own HistorySink), and business documents belong
    # to the applications themselves (the generated rows below).
    - id: application-runtime
      name: '@matrix1001/dsh-application-harness-runtime'
      config: {}

    # The unified application data store (SQLite documents/collections; not part of the world).
    # It lives under the harness home (dshHomePath — cwd-independent) so every
    # application's namespace survives restarts. Absent a path, the store is
    # in-memory only (not durable).
    - id: app-store
      name: '@matrix1001/dsh-application-harness-store'
      config:
        dbPath: !!js dshHomePath('application-harness/app-data.sqlite')

    # The application tool bridge is deliberately SCOPED: this row owns the
    # declaration-driven tool surface, but it attaches that surface only to a
    # session the application area has marked as its conversation. A standard
    # conversation (the main conversation) therefore never sees application
    # business tools, while the application-area conversation does. The runtime
    # stays global: applications run, and peer/human calls work, with no
    # conversation open at all.
    - id: app-tool-bridge
      name: '@matrix1001/dsh-application-harness-tool-bridge'

    # The page-context reader: `@page:` citations a browser page chip serialized
    # into a prompt are verified through the cited application's own AI-open read
    # operation and answered with one structured context message right after the
    # citing one (stale citations are marked stale, unopenable ones contribute
    # nothing). Reads only; it grants nothing. It injects the runtime and listens
    # on the platform's `agent/pre-step`, so a composition without an agent
    # simply never emits the step it serves.
    - id: app-context
      name: '@matrix1001/dsh-application-harness-context'

    # The browser's one door to the applications this host runs: the
    # `applications` Remote namespace (list, call with cancellation, history,
    # grants, out-of-session confirmations, stop, one watch stream) over the
    # runtime. The config names the durable grant table and the first-run
    # record; the identity is fixed at this door (every call is the human), and
    # the runtime owns everything behind it.
    - id: app-bridge
      name: '@matrix1001/dsh-application-harness-host-bridge'
      config:
        grantsPath: !!js dshHomePath('application-harness/grants.json')
        policiesPath: !!js dshHomePath('application-harness/policies.json')
        activationPath: !!js dshHomePath('application-harness/activation.json')
        modelSelectionsPath: !!js dshHomePath('application-harness/model-selections.json')
        modelUsagePath: !!js dshHomePath('application-harness/model-usage.json')
        modelLimitsPath: !!js dshHomePath('application-harness/model-limits.json')
        developmentPath: !!js dshHomePath('application-harness/development.json')
        onboardingPath: !!js dshHomePath('application-harness/onboarding.json')
        historyPath: !!js dshHomePath('application-harness/history.jsonl')
        tasksPath: !!js dshHomePath('application-harness/tasks.jsonl')
        delegationsPath: !!js dshHomePath('application-harness/delegations.json')
        conversationPath: !!js dshHomePath('application-harness/app-conversation.json')

    # The harness network capability (ctx.applicationHttp): applications make outbound
    # requests through it; an application declares no transport policy of its own.
    # The row's one tunable, `proxy`, is the application network proxy: a volatile
    # field the application area's management page edits (persisted in the user
    # layer), routing application backends only — never model calls or DSH itself.
    - id: app-http
      name: '@matrix1001/dsh-application-harness-http'

    # The browser's application shell: the applications panel (list, switching,
    # calls with cancellation, progress, history, grants, out-of-session
    # confirmation) and the `applicationViews` registry every view package
    # registers its page into. The mirror/panel/schema-ui packages are gone
    # (P8) — one shell is mounted, never two.
    # Applications mount below the generated-rows marker (aggregated from each
    # package's `dsh.appRow` declaration — one bundle layer, deterministic order).
    - id: client-applications
      name: '@matrix1001/dsh-application-harness-client-applications'
    # --- example rows (hand-written: this composition demonstrates the git-browser application) ---
    # The demo runs read-only git commands in the host's working directory; the
    # timeout keeps a slow repository from stalling the page.
    - id: git-browser
      name: '@matrix1001/dsh-application-harness-git-browser'
      config:
        timeoutMs: 10000
    - id: client-ui-git-browser
      name: '@matrix1001/dsh-application-harness-git-browser-view'

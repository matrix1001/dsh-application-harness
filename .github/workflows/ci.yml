name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · test:coverage · build · publint · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The new-code coverage gate diffs against the base branch.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate (typecheck/docs/coverage/build/scripts/publint/contracts/smoke)
        run: node scripts/gate.mjs --only typecheck,docs,coverage,build,scripts,publint,contracts,smoke,smoke-tooled
        env:
          DIFF_BASE: origin/${{ github.base_ref || 'master' }}

      - name: Build release tarball (structure check only)
        run: node scripts/build-plugin-tarball.mjs --out tmp/dist

  # The browser tier: boots an isolated instance and proves the shell and the
  # applications rail. App-surface flows self-skip without DEEPSEEK_API_KEY
  # (a fresh home shows the account gate first), so this job is stable keyless
  # and runs them for real when the secret is configured.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (the lane boots built artifacts)
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke (isolated instance)
        run: pnpm run test:browser
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

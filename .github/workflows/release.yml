name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release gate · tarball · GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is the public master snapshot
        run: |
          git fetch --no-tags origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh the platform source fixture
        run: node scripts/sync-platform-fixture.mjs --ensure

      - name: Bootstrap the isolated release profile
        run: |
          export DSH_HOME="$RUNNER_TEMP/release-home"
          export DSH_WORKSPACE="$RUNNER_TEMP/release-workspace"
          mkdir -p "$DSH_HOME" "$DSH_WORKSPACE"
          {
            echo "DSH_HOME=$DSH_HOME"
            echo "DSH_WORKSPACE=$DSH_WORKSPACE"
          } >> "$GITHUB_ENV"
          node scripts/setup.mjs --profile application-harness --no-build

      - name: Verify the tag names the bundle version
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Release check (npm line, no platform checkout)
        run: pnpm run release:check

      - name: Install Chromium for the browser lane
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke (isolated instance)
        run: pnpm run test:browser
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Tarball install acceptance in an isolated profile
        run: node scripts/test-plugin-local.mjs

      - name: Build the self-contained release asset
        run: |
          rm -rf dist
          node scripts/build-plugin-tarball.mjs --out dist

      - name: Publish the GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/matrix1001-dsh-application-harness-*.tgz
            dist/matrix1001-dsh-application-harness-*.tgz.sha256
          generate_release_notes: true
